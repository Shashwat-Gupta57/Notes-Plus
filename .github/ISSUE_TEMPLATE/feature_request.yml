name: Idea or feature request
description: Suggest something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
  - type: checkboxes
    id: apps
    attributes:
      label: Where?
      options:
        - label: Android
        - label: Windows
        - label: Web
