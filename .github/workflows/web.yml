name: Website

on:
  pull_request:
    branches: [web]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every script parses
        run: |
          for f in js/*.js app/js/*.js app/sw.js; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "::error file=$f::does not parse"; exit 1; }
          done
