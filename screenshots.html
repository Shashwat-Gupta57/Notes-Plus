<body>

    <div class="container">
      <a href="index.html" class="navbar-brand" aria-label="Notes+ home">
        <img src="res/notes_icon.png" alt="" width="36" height="36">
        Notes<span class="brand-plus">+</span>

  <header class="page-head">
    <div class="container">
      <span class="biome">[ Screenshots ]</span>
      <h1>See it <span class="c-gold">in action</span></h1>
      <p>From the overworld to the deepest vault. Tap any screen to look closer.</p>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <div class="shots">
        <figure class="shot reveal"><div class="phone"><img src="res/shots/01-notes-grid.png" data-fallback="res/ss-1.png" alt="Notes grid with cards of every type" loading="lazy"></div><p>Notes as cards, each previewing what's inside</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/02-new-note.png" alt="The New sheet with six note types" loading="lazy"></div><p>Six kinds of notes, one tap away</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/03-mind-map.png" alt="A mind map" loading="lazy"></div><p>Mind maps that tidy, fold and link</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/04-journal.png" alt="A journal entry with photos" loading="lazy"></div><p>Journal entries with mood, photos and videos</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/05-sketch.png" alt="A sketch note" loading="lazy"></div><p>Sketches with pens, markers and an eraser</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/10-account.png" alt="The account screen" loading="lazy"></div><p>Your account, synced across phones</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/06-lock-screen.png" data-fallback="res/ss-3.png" alt="The hidden lock screen" loading="lazy"></div><p>The lock screen nobody knows is there</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/07-gallery.png" data-fallback="res/ss-4.png" alt="The encrypted gallery" loading="lazy"></div><p>The encrypted gallery</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/08-viewer.png" data-fallback="res/ss-5.png" alt="The photo viewer" loading="lazy"></div><p>Full-screen viewer with zoom and video</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/09-vault-settings.png" data-fallback="res/ss-7.png" alt="Vault settings with backups" loading="lazy"></div><p>Verified backups, local and on Drive</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/11-chat-list.png" alt="The chat list" loading="lazy"></div><p>The hidden chat, with profile photos and nicknames</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/12-conversation.png" alt="A conversation" loading="lazy"></div><p>Ticks, encrypted photos, shared backgrounds</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/13-picker.png" alt="The photo picker under a conversation" loading="lazy"></div><p>Recent photos right where the keyboard was</p></figure>
        <figure class="shot reveal"><div class="phone"><img src="res/shots/14-chat-settings.png" alt="Chat settings with vault IDs" loading="lazy"></div><p>Chat vaults, each with its own ID and lock</p></figure>
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot">
    <button class="btn" data-close aria-label="Close">✕</button>
    <button class="btn" data-prev aria-label="Previous">◀</button>
    <figure><img src="" alt=""><figcaption></figcaption></figure>
    <button class="btn" data-next aria-label="Next">▶</button>
